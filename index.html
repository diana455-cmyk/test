<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест: Какой сценарий управляет твоими деньгами, отношениями и сексом</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2d3748;
    }
    .quiz-container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      position: relative;
    }
    .welcome-screen {
      text-align: center;
    }
    .welcome-screen h1 {
      font-size: 24px;
      color: #1a202c;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .instruction-box {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      font-size: 16px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 25px;
      text-align: left;
    }
    .start-btn, .restart-btn, .option-btn {
      background: #667eea;
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .start-btn:hover, .restart-btn:hover {
      background: #5a67d8;
    }
    #quiz-screen, #result-screen {
      display: none;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .progress-bar {
      height: 8px;
      background: #edf2f7;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress {
      height: 100%;
      background: #667eea;
      width: 0%;
      transition: width 0.3s ease;
    }
    .part-badge {
      display: inline-block;
      background: #e2e8f0;
      color: #4a5568;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .question-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 25px;
      color: #2d3748;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      color: #4a5568;
      text-align: left;
      font-weight: 500;
    }
    .option-btn:hover {
      border-color: #667eea;
      background: #ebf8ff;
      color: #2b6cb0;
    }
    .result-title {
      font-size: 24px;
      color: #2b6cb0;
      margin-bottom: 15px;
      text-align: center;
    }
    .result-section {
      margin-bottom: 20px;
    }
    .result-section h3 {
      font-size: 16px;
      color: #4a5568;
      margin-bottom: 8px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 4px;
    }
    .result-list {
      list-style-type: disc;
      padding-left: 20px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.6;
    }
    .result-text {
      font-size: 15px;
      line-height: 1.6;
      color: #4a5568;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <!-- Экран приветствия -->
  <div id="welcome-screen" class="welcome-screen">
    <h1>Тест:<br>Какой сценарий управляет твоими деньгами, отношениями и сексом</h1>
    <div class="instruction-box">
      <strong>Инструкция:</strong><br><br>
      Выбирай вариант, который ближе всего описывает твою реальность прямо сейчас, даже если в этом стыдно признаться самой себе.
    </div>
    <button class="start-btn" onclick="startQuiz()">Начать тест</button>
  </div>

  <!-- Экран теста -->
  <div id="quiz-screen">
    <div class="header">
      <div class="progress-bar"><div class="progress" id="progress"></div></div>
      <span class="part-badge" id="part-badge">Часть 1. Отношения</span>
    </div>
    <div class="question-text" id="question-text">Загрузка вопроса...</div>
    <div class="options">
      <button class="option-btn" onclick="selectOption('A')">A: Да</button>
      <button class="option-btn" onclick="selectOption('B')">B: Нет</button>
      <button class="option-btn" onclick="selectOption('C')">C: Другое</button>
    </div>
  </div>

  <!-- Экран результатов -->
  <div id="result-screen" class="result-container">
    <div class="result-title" id="result-name">Твой сценарий</div>
    <div id="result-content"></div>
    <button class="restart-btn" onclick="restartQuiz()">Пройти тест заново</button>
