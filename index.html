<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест: Какой сценарий управляет твоими деньгами, отношениями и сексом</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2d3748;
    }
    .quiz-container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      position: relative;
    }
    .welcome-screen {
      text-align: center;
    }
    .welcome-screen h1 {
      font-size: 22px;
      color: #1a202c;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .instruction-box {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      font-size: 15px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 25px;
      text-align: left;
    }
    .start-btn, .restart-btn, .option-btn {
      background: #667eea;
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .start-btn:hover, .restart-btn:hover {
      background: #5a67d8;
    }
    #quiz-screen, #result-screen {
      display: none;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .progress-bar {
      height: 8px;
      background: #edf2f7;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress {
      height: 100%;
      background: #667eea;
      width: 0%;
      transition: width 0.3s ease;
    }
    .part-badge {
      display: inline-block;
      background: #e2e8f0;
      color: #4a5568;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .question-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 25px;
      color: #2d3748;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      color: #4a5568;
      text-align: left;
      font-weight: 500;
      padding: 14px;
      line-height: 1.4;
    }
    .option-btn:hover {
      border-color: #667eea;
      background: #ebf8ff;
      color: #2b6cb0;
    }
    .result-title {
      font-size: 22px;
      color: #2b6cb0;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }
    .result-section {
      margin-bottom: 20px;
    }
    .result-section h3 {
      font-size: 16px;
      color: #2d3748;
      margin-bottom: 10px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 6px;
    }
    .result-list {
      list-style-type: disc;
      padding-left: 20px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.6;
      color: #4a5568;
    }
    .result-text {
      font-size: 14px;
      line-height: 1.6;
      color: #4a5568;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <!-- Экран приветствия -->
  <div id="welcome-screen" class="welcome-screen">
    <h1>Тест:<br>Какой сценарий управляет твоими деньгами, отношениями и сексом</h1>
    <div class="instruction-box">
      <strong>Инструкция:</strong><br><br>
      Выбирай вариант, который ближе всего описывает твою реальность прямо сейчас, даже если в этом стыдно признаться самой себе.
    </div>
    <button class="start-btn" id="start-btn">Начать тест</button>
  </div>

  <!-- Экран теста -->
  <div id="quiz-screen">
    <div class="header">
      <div class="progress-bar"><div class="progress" id="progress"></div></div>
      <span class="part-badge" id="part-badge">Часть 1. Отношения</span>
    </div>
    <div class="question-text" id="question-text">Загрузка вопроса...</div>
    <div class="options">
      <button class="option-btn" id="btn-a">A: Это про меня</button>
      <button class="option-btn" id="btn-b">B: Скорее да, чем нет</button>
      <button class="option-btn" id="btn-c">C: Совсем не про меня</button>
    </div>
  </div>

  <!-- Экран результатов -->
  <div id="result-screen">
    <div class="result-title" id="result-name">Твой сценарий</div>
    <div id="result-content"></div>
    <button class="restart-btn" id="restart-btn">Пройти тест заново</button>
  </div>
</div>

<script>
const questions = [
  // Часть 1. Отношения
  { part: "Часть 1. Отношения", type: "A", text: "1. Я полностью растворяюсь в партнёре или семье. Задвигаю свои интересы, планы и желания на задний план." },
  { part: "Часть 1. Отношения", type: "A", text: "2. Я молча проглатываю обиды, хамство и неуважение, потому что панически боюсь конфликтов, проще промолчать или согласиться." },
  { part: "Часть 1. Отношения", type: "A", text: "3. Я тяну на себе эмоциональное состояние партнёра, помогаю решить его проблемы и заслуживаю его одобрение своей жертвенностью." },
  { part: "Часть 1. Отношения", type: "B", text: "4. Я задолбалась быть ломовой лошадью, на мне дом, дети, родители и если я хотя бы на день сяду сложа руки — всё рухнет." },
  { part: "Часть 1. Отношения", type: "B", text: "5. Рядом со мной либо инфантильные тюфяки, на которых нельзя опереться, либо те кто пытается подмять под себя." },
  { part: "Часть 1. Отношения", type: "B", text: "6. Я постоянно жду от партнера включенности, ответственности и правильных поступков, но он не дотягивает до моих стандартов." },
  { part: "Часть 1. Отношения", type: "C", text: "7. Рядом со мной могут быть люди, но я чувствую себя абсолютно одинокой, меня как будто не существует." },
  { part: "Часть 1. Отношения", type: "C", text: "8. Мне проще вообще никого не подпускать близко, я часто ловлю себя на мысли что лучше быть одной." },
  { part: "Часть 1. Отношения", type: "C", text: "9. Если мне хреново, я никому об этом не скажу, а запрусь в комнате и выплачусь в подушку." },
  { part: "Часть 1. Отношения", type: "C", text: "10. Просить о поддержке или тепле для меня — это унижение, потому что это бессмысленно." },
  
  // Часть 2. Деньги
  { part: "Часть 2. Деньги", type: "A", text: "11. Все мои деньги и силы уходят на семью, мужа или других людей, а себе — по остаточному принципу." },
  { part: "Часть 2. Деньги", type: "A", text: "12. Мне страшно назвать нормальную цену или заявить о себе. Могу согласиться на невыгодную стоимость или сделать скидку." },
  { part: "Часть 2. Деньги", type: "A", text: "13. Я финансирую всех вокруг: инфантильных партнеров, родственников, оплачиваю их потребности и желания." },
  { part: "Часть 2. Деньги", type: "B", text: "14. Я задираю к себе планку, пашу на 300% и вечно чувствую себя «недостаточно профессиональной»." },
  { part: "Часть 2. Деньги", type: "B", text: "15. Мне проще упахаться до полусмерти и заработать всё самой, чем у кого-то о чем-то попросить." },
  { part: "Часть 2. Деньги", type: "B", text: "16. Я зарабатываю, но не могу расслабиться и потратить деньги на удовольствие. Внутри фонит: «Я еще мало сделала»." },
  { part: "Часть 2. Деньги", type: "C", text: "17. Я панически боюсь остаться без копейки, потому что рассчитывать можно только на свои надпочечники." },
  { part: "Часть 2. Деньги", type: "C", text: "18. Мне жалко денег на себя, зато я могу копить на «черный день», потому что тратить на удовольствие кажется опасным." },
  { part: "Часть 2. Деньги", type: "C", text: "19. Зарабатывать деньги тяжело, но просить или принимать финансовую помощь от кого-то — унизительно." },
  
  // Часть 3. Секс
  { part: "Часть 3. Секс", type: "A", text: "20. Секс для меня — это еще одна обязанность, я ложусь в постель «чтобы он не дулся и не гулял»." },
  { part: "Часть 3. Секс", type: "A", text: "21. Я годами имитирую оргазм и соглашаюсь на то, что мне неприятно, лишь бы сохранить мир в семье." },
  { part: "Часть 3. Секс", type: "A", text: "22. Мои собственные желания в постели полностью выключены. Я привыкла быть удобным объектом." },
  { part: "Часть 3. Секс", type: "B", text: "23. Моя голова в постели вообще не отключается. Вместо того чтобы чувствовать тело, я сканирую обстановку или тревожусь о делах." },
  { part: "Часть 3. Секс", type: "B", text: "24. Мне физически трудно расслабиться и полностью довериться партнеру. Потерять контроль — равносильно потере безопасности." },
  { part: "Часть 3. Секс", type: "B", text: "25. Если я не испытываю ярких эмоций или оргазма, я начинаю грызть себя за то, что со мной что-то не так." },
  { part: "Часть 3. Секс", type: "C", text: "26. В постели я могу механически выполнять всё, что нужно, но внутри меня в этот момент вообще нет. Мое тело как будто отдельно." },
  { part: "Часть 3. Секс", type: "C", text: "27. После секса накатывает дикая пустота. Физическая близость есть, а тепла, принятия и ощущения любви — нет." },
  { part: "Часть 3. Секс", type: "C", text: "28. Мне физически невыносимо, когда меня начинают по-настоящему гладить, трогать или смотреть в глаза во время близости." }
];

const results = {
  A: {
    title: "Сценарий: Удобная женщина",
    phrases: [
      "Я сказала — значит так и будет! Свое мнение засунь куда подальше.",
      "Перетопчешься! Мало ли чего ты хочешь.",
      "Не смей спорить со старшими! Ишь какая умная выросла.",
      "Заткнись и делай, что говорят.",
      "Я ради тебя всем пожертвовала, а ты, неблагодарная...",
      "Стыдно быть такой эгоисткой! Подумай о нас, а не о себе.",
      "Вот будешь послушной девочкой — тогда и поговорим.",
      "Не выделывайся, кому ты нужна со своими капризами."
    ],
    trap: "Когда ты была ребенком, твой мозг не умел мыслить критически, у него была задача выжить любой ценой. Если за твое «нет» или попытку отстоять себя следовал крик, холод или наказание, мозг сделал вывод: «Быть собой смертельно опасно. Безопасно только тогда, когда я молчу».<br><br>Теперь каждый раз, когда ты пытаешься выбрать себя, твой мозг автоматически глушит твои желания еще на взлете, заставляя подстраиваться под окружающих.",
    body: "• Поверхностное дыхание «вполгруди» (страх занять пространство).<br>• Мышечный панцирь: зажатая челюсть (невысказанный гнев) и ком в горле.<br>• Тело привыкло быть функцией и объектом обслуживания, отключив чувствительность.",
    solution: "Чтобы этот сценарий перестал вами управлять, нужно поработать с реакциями на уровне: Тела, Эмоций, Мыслей, Детских неосознанных решений и Действий."
  },
  B: {
    title: "Сценарий: Без права на ошибку!",
    phrases: [
      "Ты можешь учиться/делать лучше, что люди скажут?",
      "Четыре — это не оценка.",
      "Сделала хорошо, но можно было лучше постараться.",
      "Хочешь сделать хорошо — сделай сама.",
      "На тебя нельзя положиться, вечно всё за тобой переделывать.",
      "Делу — время, потехе — час. Хватит бездельничать.",
      "Слабакам здесь не место, хватит ныть, соберись!"
    ],
    trap: "Детский мозг усвоил железное правило: «Любовь, ценность и безопасность можно заслужить только безупречностью. Расслабиться или ошибиться нельзя — мир рухнет».<br><br>Теперь каждый раз, когда ты хочешь снизить темп или выдохнуть, включается центр страха (амигдала). Она поднимает тревогу, заставляя тебя пахать на пределе и держать всё под тотальным контролем.",
    body: "• Каменные плечи и зажатая шея (груз ответственности, который ты тащишь на себе).<br>• Мышечный панцирь: жестко сжатые челюсти.<br>• Нервная система разучилась отпускать напряжение даже в постели.",
    solution: "Чтобы этот сценарий перестал вами управлять, нужно поработать с реакциями на уровне: Тела, Эмоций, Мыслей, Детских неосознанных решений и Действий."
  },
  C: {
    title: "Сценарий: Сильная и одинокая",
    phrases: [
      "Хватит реветь, никто к тебе с платочком не побежит.",
      "Перестань устраивать истерики, всем наплевать на твои капризы.",
      "Рассчитывай только на себя, надеяться в этой жизни не на кого.",
      "Никто за тебя твои проблемы решать не будет, привыкай.",
      "Никто с тобой связываться не будет с таким характером."
    ],
    trap: "Детский мозг столкнулся с эмоциональным холодом и сделал вывод: «Близость — это больно. Просить о тепле нельзя, в ответ будет пустота».<br><br>Теперь каждый раз, когда ты хочешь открыться или попросить о помощи, мозг включает режим глухой обороны и заставляет тебя отталкивать людей первой, чтобы не столкнуться со старой болью.",
    body: "• Мышечный панцирь: заблокированная, сжатая грудная клетка.<br>• Тело заморожено, физический контакт есть, но душа закрыта наглухо.",
    solution: "Чтобы этот сценарий перестал вами управлять, нужно поработать с реакциями на уровне: Тела, Эмоций, Мыслей, Детских неосознанных решений и Действий."
  }
};

let currentQuestion = 0;
let answers = { A: 0, B: 0, C: 0 };

document.getElementById('start-btn').addEventListener('click', function() {
  document.getElementById("welcome-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  showQuestion();
});

document.getElementById('btn-a').addEventListener('click', function() { handleAnswer('A'); });
document.getElementById('btn-b').addEventListener('click', function() { handleAnswer('B'); });
document.getElementById('btn-c').addEventListener('click', function() { handleAnswer('C'); });

function showQuestion() {
  const q = questions[currentQuestion];
  document.getElementById("part-badge").innerText = q.part;
  document.getElementById("question-text").innerText = q.text;
  
  const progressPercent = ((currentQuestion) / questions.length) * 100;
  document.getElementById("progress").style.width = progressPercent + "%";
}

function handleAnswer(choice) {
  const q = questions[currentQuestion];
  if (choice === 'A') {
    answers[q.type] += 2;
  } else if (choice === 'B') {
    answers[q.type] += 1;
  }
  
  currentQuestion++;
  
  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("result-screen").style.display = "block";
  
  let topResult = 'A';
  if (answers.B >= answers.A && answers.B >= answers.C) topResult = 'B';
  if (answers.C >= answers.A && answers.C >= answers.B) topResult = 'C';
  
  const res = results[topResult];
  document.getElementById("result-name").innerText = res.title;
  
  let phrasesHtml = res.phrases.map(p => `<li>${p}</li>`).join('');
  
  document.getElementById("result-content").innerHTML = `
    <div class="result-section">
      <h3>1. Формирование: Фразы, которые запрограммировали твою роль</h3>
      <ul class="result-list">${phrasesHtml}</ul>
    </div>
    <div class="result-section">
      <h3>2. В чем наш мозг нас обманывает / ловушка?</h3>
      <div class="result-text">${res.trap}</div>
    </div>
    <div class="result-section">
      <h3>3. На уровне тела:</h3>
      <div class="result-text">${res.body}</div>
    </div>
    <div class="result-section">
      <h3>4. Что делать:</h3>
      <div class="result-text"><strong>${res.solution}</strong></div>
    </div>
  `;
}

document.getElementById('restart-btn').addEventListener('click', function() {
  currentQuestion = 0;
  answers = { A: 0, B: 0, C: 0 };
  document.getElementById("result-screen").style.display = "none";
  document.getElementById("welcome-screen").style.display = "block";
});
</script>
</body>
</html>
